[project]
name = "aevum"
version = "1.0.0"
description = "God-tier asyncio extension library for building async frameworks"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Aevum Contributors"}]
keywords = ["asyncio", "event-loop", "framework", "async", "concurrency"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
    "Topic :: System :: Networking",
]
dependencies = [
    "psutil>=5.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
    "pyright>=1.1.300",
]
docs = [
    "sphinx>=7.2.0",
    "furo>=2023.7.10",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "strict"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "W", "UP", "B", "C4", "SIM", "T20", "PIE", "PT", "QF", "RUF", "PTH", "ERA", "PD", "TRY", "NPY", "RET", "FLY", "PERF", "LOG", "ARG", "TCH", "INT", "ASYNC", "PL"]
ignore = ["S101", "S311", "S603", "S607", "PLW0603", "T201"]
extend-select = ["ASYNC"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_optional = true
enable_error_code = ["override"]
namespace_packages = true

[tool.setuptools.packages.find]
where = ["."]
include = ["aevum*"]